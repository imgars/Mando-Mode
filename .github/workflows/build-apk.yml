name: Build APK & Publish Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Android project
        working-directory: artifacts/mobile-app
        run: npx expo prebuild --platform android --clean --no-install

      - name: Make gradlew executable
        working-directory: artifacts/mobile-app/android
        run: chmod +x gradlew

      - name: Bundle JavaScript
        working-directory: artifacts/mobile-app
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo-router/entry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res \
            --reset-cache

      - name: Build APK
        working-directory: artifacts/mobile-app/android
        run: ./gradlew assembleRelease -x createBundleReleaseJsAndAssets --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m"

      - name: Find APK
        id: find_apk
        run: |
          APK_PATH=$(find artifacts/mobile-app/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"

      - name: Verify APK exists
        run: |
          if [ ! -f "${{ steps.find_apk.outputs.apk_path }}" ]; then
            echo "ERROR: APK file not found"
            exit 1
          fi
          ls -lh "${{ steps.find_apk.outputs.apk_path }}"

      - name: Get version
        id: version
        working-directory: artifacts/mobile-app
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}-${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Copy APK with final name
        run: cp "${{ steps.find_apk.outputs.apk_path }}" cuphead-ui.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Cuphead UI ${{ steps.version.outputs.version }}
          body: |
            **Cuphead UI** v${{ steps.version.outputs.version }}

            Descarga el archivo `.apk` e instálalo en tu dispositivo Android.

            ### Cómo instalar
            1. Descarga el archivo `cuphead-ui.apk`
            2. En Android: Ajustes → Seguridad → Fuentes desconocidas (activar)
            3. Abre el archivo descargado e instala
          files: cuphead-ui.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
