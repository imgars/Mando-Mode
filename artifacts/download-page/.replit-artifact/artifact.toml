kind = "web"
previewPath = "/download/"
title = "Cuphead UI - Descarga"
version = "1.0.0"
id = "artifacts/download-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22608
name = "web"
paths = ["/download/"]

[services.development]
run = "pnpm --filter @workspace/download-page run dev"

[services.env]
PORT = "22608"
BASE_PATH = "/download/"

[services.production]
build = ["pnpm", "--filter", "@workspace/download-page", "run", "build"]
publicDir = "artifacts/download-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
